name: test and deploy
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REHOTEQ_FIELD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix functions install
      - run: npx --yes firebase-tools@13 deploy --only functions,firestore:rules --project rehoteq-field --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT_REHOTEQ_FIELD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REHOTEQ_FIELD }}
