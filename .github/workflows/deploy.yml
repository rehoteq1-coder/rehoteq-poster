name: test and deploy
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/smoke.test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy functions and rules (skipped until the service account secret is added)
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_REHOTEQ_FIELD:-}" ]; then
            echo "Skipping deploy. Add the FIREBASE_SERVICE_ACCOUNT_REHOTEQ_FIELD repository secret (Firebase service-account JSON) to enable CI deploys."
            exit 0
          fi
          npm --prefix functions install
          npx --yes firebase-tools@13 deploy --only functions,firestore:rules --project rehoteq-field --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT_REHOTEQ_FIELD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REHOTEQ_FIELD }}
