name: test and deploy
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/smoke.test.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy functions, rules and hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_REHOFLOW: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REHOFLOW }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_REHOFLOW:-}" ]; then
            echo "Skipping deploy. Add the FIREBASE_SERVICE_ACCOUNT_REHOFLOW repository secret (Firebase service-account JSON) to enable CI deploys."
            exit 0
          fi
          echo "${FIREBASE_SERVICE_ACCOUNT_REHOFLOW}" > "$GITHUB_WORKSPACE/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$GITHUB_WORKSPACE/sa.json"
          gcloud auth activate-service-account --key-file="$GITHUB_WORKSPACE/sa.json" --quiet
          gcloud services enable secretmanager.googleapis.com --project rehoflow --quiet
          npm --prefix functions install
          if [ -n "${FB_APP_ID:-}" ] && [ -n "${FB_APP_SECRET:-}" ]; then
            printf '%s' "$FB_APP_ID" > fbappid.txt
            printf '%s' "$FB_APP_SECRET" > fbappsecret.txt
            npx --yes firebase-tools@13 functions:secrets:set FB_APP_ID --data-file fbappid.txt --project rehoflow --force --non-interactive
            npx --yes firebase-tools@13 functions:secrets:set FB_APP_SECRET --data-file fbappsecret.txt --project rehoflow --force --non-interactive
            rm -f fbappid.txt fbappsecret.txt
          else
            echo "FB_APP_ID / FB_APP_SECRET repo secrets missing; Meta posting will fail until they are set."
          fi
          npx --yes firebase-tools@13 deploy --only functions,firestore:rules,hosting --project rehoflow --non-interactive
